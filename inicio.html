<body class="pagina">

<section class="nodo fondo-biblio" id="inicio"><h1 class="titulo">Club de Lectura ♡</h1><p class="pista">▼ Hacé clic en la puerta ▼</p><a class="puerta" href="golpes.html"><span>Sala de lectura</span></a><div class="caja">Estás en la biblioteca, frente a la puerta de la sala de lectura. Hoy es tu primer día en el club.</div></section>
<script>
/* Clic en la puerta: se abre (imagen 2) y un instante después pasa a la escena siguiente.
   Sin JavaScript el enlace sigue funcionando igual, solo que sin el instante de puerta abierta. */
document.querySelectorAll('a.puerta').forEach(function(p){
  p.addEventListener('click',function(e){
    if(p.classList.contains('abre'))return;
    e.preventDefault();
    p.classList.add('abre');
    setTimeout(function(){location.href=p.getAttribute('href');},650);
  });
});
</script>
<script>
/* Música de fondo: esta página le avisa al marco (index.html) si debe sonar o no.
   La música vive en el marco, por eso no se reinicia al cambiar de escena. */
(function(){
  var estado = 'on';
  function avisar(){ try{ parent.postMessage({musica:estado},'*'); }catch(e){} }
  avisar();
  if(estado==='on'){ addEventListener('pointerdown',avisar); addEventListener('keydown',avisar); }
})();
</script>
</body>
</html>
