<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club de Lectura ♡</title>
<style>
html,body{margin:0;height:100%;background:#2a1226;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<!-- El juego corre dentro de este marco. Como este documento nunca se recarga,
     el <audio> sigue sonando sin reiniciarse mientras cambian las escenas. -->
<iframe name="juego" src="inicio.html" title="Club de Lectura"></iframe>
<audio id="musica" loop preload="auto"></audio>
<script src="contenido.js"></script>
<script>
var a = document.getElementById('musica');
a.src = JUEGO.musica.archivo;
a.volume = JUEGO.musica.volumen;
var quiere = true;                       // ¿esta escena pide música?
function sonar(){ if(quiere && a.paused){ a.play().catch(function(){}); } }
addEventListener('message', function(e){
  if(!e.data || typeof e.data.musica === 'undefined') return;
  if(e.data.musica === 'on'){ quiere = true; sonar(); }   // play() sobre algo que ya suena no lo reinicia
  else { quiere = false; a.pause(); }                     // escenas de Monika: pausa (no se rebobina)
});
addEventListener('pointerdown', sonar);
addEventListener('keydown', sonar);
sonar();                                 // intenta arrancar ya; el navegador puede exigir un primer clic
</script>
</body>
</html>
